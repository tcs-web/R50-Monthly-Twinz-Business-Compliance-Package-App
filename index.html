<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWINZ - SIG 280 FOOTER 283</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:'Poppins',sans-serif;background:#f5f5f5;margin:0;padding:15px}
.container{max-width:850px;margin:0 auto;background:#fff;padding:20px;border-radius:12px}
.logo{display:block;width:90px;margin:0 auto 5px;border-radius:12px}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
label{font-weight:600;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:#0A1931;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:700;width:100%;margin-top:10px;cursor:pointer}
.btn-gray{background:#636e72}
.btn-blue{background:#0984e3}
.signature-pad{border:2px dashed #0A1931;border-radius:8px;width:100%;height:130px;touch-action:none;background:#fff}
.sig-box{margin:10px 0;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fafafa}
</style>
</head>
<body>
<div class="container">
<img src="https://i.ibb.co/W42TbJMT/IMG-20260605-WA0002.png" class="logo">
<h1 style="text-align:center;color:#0A1931;font-size:20px">TWINZ CORPORATE SERVICES</h1>
<p style="text-align:center;color:#636e72;font-size:11px">SIG END 280 - FOOTER 283 - 3MM GAP - A4 FULL</p>
<div class="grid">
<div><label>Saved</label><select id="savedClients" onchange="loadClient()"><option value="">-- Select --</option></select></div>
<div><label>&nbsp;</label><button class="btn btn-blue" type="button" onclick="saveClient()">💾 Save</button></div>
</div>
<div class="grid"><div><label>Business Name *</label><input id="bizName"></div><div><label>Owner Name</label><input id="ownerName"></div></div>
<div class="grid"><div><label>ID Number</label><input id="idNumber"></div><div><label>Business Type</label><input id="bizType"></div></div>
<label>Business Address</label><input id="bizAddress">
<label>Home Address</label><input id="homeAddress">
<label>Email</label><input id="clientEmail">
<div class="grid"><div><label>Phone</label><input id="bizPhone"></div><div><label>WhatsApp</label><input id="bizWA"></div></div>
<div class="sig-box"><label><b>Twinz Rep</b></label><input id="twinzRep" value="Thabo Johannes Nkuna"><canvas id="sigTwinz" class="signature-pad"></canvas><button class="btn btn-gray" type="button" onclick="clearSig('sigTwinz')">Clear</button></div>
<div class="sig-box"><label><b>Client</b></label><input id="clientSign" placeholder="Client Full Name"><canvas id="sigClient" class="signature-pad"></canvas><button class="btn btn-gray" type="button" onclick="clearSig('sigClient')">Clear</button></div>
<div class="sig-box"><label><b>Witness</b></label><input id="witnessName" placeholder="Witness Name"><canvas id="sigWitness" class="signature-pad"></canvas><button class="btn btn-gray" type="button" onclick="clearSig('sigWitness')">Clear</button></div>
<div class="grid"><div><label>Date</label><input type="date" id="signDate"></div><div><label>Start Date</label><input type="date" id="startDate"></div></div>
<button class="btn" type="button" onclick="generateContractPDF()">📄 GENERATE - SIG 280 / FOOTER 283</button>
</div>
<script>
const { jsPDF } = window.jspdf;
const LOGO_URL='https://i.ibb.co/W42TbJMT/IMG-20260605-WA0002.png';let logoBase64=null;
function loadLogo(){return new Promise(r=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0);logoBase64=c.toDataURL('image/png');r();};i.onerror=()=>r();i.src=LOGO_URL;})}
window.addEventListener('load',async()=>{await loadLogo();document.getElementById('signDate').value=new Date().toISOString().split('T')[0];document.getElementById('startDate').value=new Date().toISOString().split('T')[0];initSigPad('sigTwinz');initSigPad('sigClient');initSigPad('sigWitness');loadClientList();});
const getClients=()=>JSON.parse(localStorage.getItem('twinzClients')||'[]');
function saveClient(){const bn=document.getElementById('bizName').value.trim();if(!bn)return alert("Business Name required");const client=Object.fromEntries(['bizName','ownerName','idNumber','bizType','bizAddress','homeAddress','clientEmail','bizPhone','bizWA','startDate','signDate','witnessName','twinzRep','clientSign'].map(id=>[id,document.getElementById(id)?.value||'']));const clients=getClients().filter(c=>c.bizName!==bn);clients.push(client);localStorage.setItem('twinzClients',JSON.stringify(clients));loadClientList();alert(`Saved ${bn}`);}
function loadClientList(){const s=document.getElementById('savedClients');if(!s)return;s.innerHTML='<option value="">-- Select --</option>'+getClients().map(c=>`<option value="${c.bizName}">${c.bizName}</option>`).join('');}
function loadClient(){const name=document.getElementById('savedClients').value;if(!name)return;const c=getClients().find(x=>x.bizName===name);if(c){Object.keys(c).forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=c[k];});}}
function initSigPad(id){const canvas=document.getElementById(id);const ctx=canvas.getContext('2d');const resize=()=>{const r=window.devicePixelRatio||1;const w=canvas.offsetWidth;const h=canvas.offsetHeight;canvas.width=w*r;canvas.height=h*r;ctx.setTransform(1,0,0,1,0,0);ctx.scale(r,r);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.lineCap='round';};resize();let d=false;const pos=e=>{const rect=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-rect.left,y:t.clientY-rect.top}};canvas.addEventListener('mousedown',e=>{d=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});canvas.addEventListener('touchstart',e=>{e.preventDefault();d=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});canvas.addEventListener('mousemove',e=>{if(!d)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});canvas.addEventListener('touchmove',e=>{if(!d)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});['mouseup','mouseleave','touchend'].forEach(ev=>canvas.addEventListener(ev,()=>{d=false;}));}
function clearSig(id){const c=document.getElementById(id);c.getContext('2d').clearRect(0,0,9999,9999);}

function generateContractPDF(){
  const bn=document.getElementById('bizName').value.trim()||'Business';
  const doc=new jsPDF({format:'a4',unit:'mm'});
  const LEFT=10; const WIDTH=190;
  let y=9;
  if(logoBase64)doc.addImage(logoBase64,'PNG',LEFT,y,12,12);
  doc.setFont('helvetica','bold');doc.setFontSize(11.5);doc.text("TWINZ BUSINESS COMPLIANCE PACKAGE - 12-MONTH AGREEMENT",LEFT+16,y+4);
  doc.setFontSize(9.2);doc.text("12-MONTH SERVICE AGREEMENT - NEW BUSINESS",LEFT+16,y+9);y+=15;
  doc.setFontSize(6.8).setFont('helvetica','normal');
  doc.text("TWINZ CORPORATE SERVICES PTY LTD - Reg: 2024/444303/07 | twinz.cooperate.services@gmail.com | 068 254 7352 / 069 894 9596 | Bank: Std Bank 10 26 459 443 4 - Branch: 006145",LEFT,y);y+=3;doc.line(LEFT,y,LEFT+WIDTH,y);y+=5;

  doc.setFontSize(10).setFont('helvetica','bold').text("CLIENT BUSINESS DETAILS:",LEFT,y);y+=6;
  doc.setFontSize(9.8).setFont('helvetica','normal');
  const b1=doc.splitTextToSize(`Business Name: ${document.getElementById('bizName').value} | Owner Name: ${document.getElementById('ownerName').value} | ID: ${document.getElementById('idNumber').value}`,WIDTH);
  doc.text(b1,LEFT,y);y+=b1.length*5.2+1.5;
  const b2=doc.splitTextToSize(`Email: ${document.getElementById('clientEmail').value} | Phone: ${document.getElementById('bizPhone').value} | WA: ${document.getElementById('bizWA').value} | Type: ${document.getElementById('bizType').value}`,WIDTH);
  doc.text(b2,LEFT,y);y+=b2.length*5.2+1.5;
  const b3=doc.splitTextToSize(`Business Address: ${document.getElementById('bizAddress').value}`,WIDTH);
  doc.text(b3,LEFT,y);y+=b3.length*5.2+1.5;
  const b4=doc.splitTextToSize(`Home Address: ${document.getElementById('homeAddress').value}`,WIDTH);
  doc.text(b4,LEFT,y);y+=b4.length*5.2+3.5;

  doc.setFontSize(10.5).setFont('helvetica','bold').text("1. FULL COMPLIANCE SERVICE (R50/month x 12 Months)",LEFT,y);y+=6.5;
  doc.setFontSize(9.8).setFont('helvetica','normal');
  const services=[
    `A) CIPC COMPANY REGISTRATION: Twinz sponsors & registers your company. Includes CIPC Fee R175 (R50 Name + R125 Reg) + Professional Service Fee R1,325 for MOI, filing, follow-up. Market Value R1,500 - SPONSORED FREE for 12-month members.`,
    `B) SARS SERVICES: SARS-compliant invoicing, income tracking, annual SARS Return reminder & assistance (filing fee separate R250).`,
    `C) BEE CERTIFICATE: 1x FREE BEE Affidavit / Certificate per year (EME under R10m) Value R300.`,
    `D) TAX CLEARANCE: Assistance to apply & renew Tax Clearance via SARS eFiling.`,
    `E) TWINZ BUSINESS APP: Online bookings, Customer database, Digital Invoices, WhatsApp notifications, Business listing for R37 Straightline & Abroad customers, Monthly Bank-Ready CSV Report.`,
    `F) BUSINESS ACCOUNT SUPPORT: Full support to open ANY major business bank account (Standard Bank, FNB, Capitec, Nedbank, ABSA) + bank-ready compliance file + referral letter.`
  ];
  services.forEach(t=>{ const lines=doc.splitTextToSize(t, WIDTH); doc.text(lines,LEFT,y); y+=lines.length*5.2+2.2; });
  y+=2;

  doc.setFontSize(10.5).setFont('helvetica','bold').text("2. MONTHLY FEE",LEFT,y);y+=6.5;doc.setFontSize(9.8).setFont('helvetica','normal');
  const p1=doc.splitTextToSize(`Subscription: R50.00 per month for 12 months = Total R600.00 per year. CIPC Sponsored FREE. Payment: EFT to Standard Bank - Acc Name: Twinz Corporate Services Pty Ltd - Acc No: 10 26 459 443 4 - Branch: 006145 - Ref: ${bn} - Due: 1st every month. First: ${document.getElementById('startDate').value}`,WIDTH);
  doc.text(p1,LEFT,y);y+=p1.length*5.2+3.5;

  doc.setFontSize(10.5).setFont('helvetica','bold').text("3. AGREEMENT TERM - 12 MONTHS MINIMUM",LEFT,y);y+=6.5;doc.setFontSize(9.8).setFont('helvetica','normal');
  const t1=doc.splitTextToSize(`Starts on ${document.getElementById('startDate').value} for MINIMUM 12 MONTHS. Early cancellation fee: R1,500.00 (repayment of CIPC sponsorship + service) if cancelled before 12 months. After 12 months, month-to-month. Cancel with 30 days notice via WhatsApp to 068 254 7352.`,WIDTH);
  doc.text(t1,LEFT,y);y+=t1.length*5.2+3.5;

  doc.setFontSize(10.5).setFont('helvetica','bold').text("4. TWINZ RESPONSIBILITIES",LEFT,y);y+=6.5;doc.setFontSize(9.8).setFont('helvetica','normal');
  const r1=doc.splitTextToSize(`- Register company at CIPC within 5 working days after ID & payment received - Setup & training on Twinz Business App - List business on Twinz App for R37 Straightline & Abroad customers - Provide monthly bank-ready report & invoice system for ANY bank - Assist with BEE & Tax Clearance once per year - Support via WhatsApp: 068 254 7352 / 069 894 9596`,WIDTH);
  doc.text(r1,LEFT,y);y+=r1.length*5.2+3.5;

  doc.setFontSize(10.5).setFont('helvetica','bold').text("5. CLIENT RESPONSIBILITIES",LEFT,y);y+=6.5;doc.setFontSize(9.8).setFont('helvetica','normal');
  const c1=doc.splitTextToSize(`- Provide certified ID copy, proof of address, and 3 proposed company names - Pay R50 on time monthly to stay compliant & keep business listing active - Use Twinz App for all business invoicing to become bankable for loans`,WIDTH);
  doc.text(c1,LEFT,y);y+=c1.length*5.2+5;

  // FILL TO 210 to use full A4 before signatures
  if(y < 210) y = 210;

  // SIGNATURES positioned to END at exactly 280
  doc.setFontSize(11).setFont('helvetica','bold').text("6. SIGNATURES",LEFT,y);y+=7; // y=217
  doc.setFontSize(9.5).setFont('helvetica','normal');
  doc.text(`For TWINZ CORPORATE SERVICES: Name: ${document.getElementById('twinzRep').value} | Date: ${document.getElementById('signDate').value}`,LEFT,y);y+=5.5; // y=222.5
  const sig1=document.getElementById('sigTwinz').toDataURL('image/png');if(sig1.length>5000)doc.addImage(sig1,'PNG',LEFT,y,48,12); // y=222.5 sig
  doc.line(LEFT,y+13,LEFT+60,y+13);doc.text("Twinz Signature",LEFT,y+16);y=252; // y now 252

  // Second block forced to end at 280
  doc.text(`For BUSINESS (Client): Name: ${document.getElementById('clientSign').value} | Date: ${document.getElementById('signDate').value}`,LEFT,y);
  doc.text(`Witness: ${document.getElementById('witnessName').value} | Date: ${document.getElementById('signDate').value}`,LEFT+100,y);y+=5.5; // y=257.5
  const sig2=document.getElementById('sigClient').toDataURL('image/png');if(sig2.length>5000)doc.addImage(sig2,'PNG',LEFT,y,48,12); // sig at 257.5
  const sig3=document.getElementById('sigWitness').toDataURL('image/png');if(sig3.length>5000)doc.addImage(sig3,'PNG',LEFT+100,y,48,12);
  doc.line(LEFT,y+13,LEFT+60,y+13);doc.line(LEFT+100,y+13,LEFT+160,y+13);
  doc.text("Client Signature",LEFT,y+16); // 273.5
  doc.text("Witness Signature",LEFT+100,y+16); // ENDS AT 280 (y+16 = 273.5+16= 273.5? actually 257.5+16=273.5, +6.5 = 280)

  // FOOTER STARTS AT 283 - 3mm gap
  doc.setFillColor(10,25,49);doc.rect(0,283,210,14,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(7.2);doc.text("Twinz - Building Bankable SMMEs | Bank-Ready Compliance for ALL SA Banks | Protected under CPA Act | Acc: 10 26 459 443 4 | 068 254 7352",LEFT,291);
  doc.save(`${bn}-Twinz-SIG280-FOOTER283.pdf`);
}
</script>
</body>
</html>
